# Construye el worker serverless de Omnia y lo publica en GitHub Container Registry
# cuando cambia la carpeta serverless/ (o a mano desde la pestaña Actions).
name: Serverless Omnia

on:
  push:
    branches: [main]
    paths: ['serverless/**', '.github/workflows/serverless.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omnia-serverless" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: serverless
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
