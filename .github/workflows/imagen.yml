# Construye la imagen de Omnia y la publica en GitHub Container Registry
# cada vez que se suben cambios a main (o a mano desde la pestaña Actions).
name: Imagen Omnia

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - base: runpod/comfyui:cuda12.8
            tag: cuda12.8
          - base: runpod/comfyui:cuda13.0
            tag: cuda13.0
    steps:
      - name: Liberar espacio (la imagen base de ComfyUI es grande)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omnia" >> "$GITHUB_ENV"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BASE_IMAGE=${{ matrix.base }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.tag }}
            ${{ env.IMAGE }}:${{ matrix.tag }}-${{ github.sha }}
